[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "liwenjson"
version = "1.5.4"
description = "The local execution gate for LLM output: an MCP server and streaming JSON repair, powered by the MoonBit engine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LIWENJSON contributors" }]
keywords = [
  "json",
  "repair",
  "streaming",
  "llm",
  "tool-call",
  "mcp",
  "execution-gate",
  "moonbit",
  "json-schema",
  "partial-json",
  "agent",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  # The wheel is tagged `py3-none-any` because it bundles the engine for
  # several platforms in one artefact, but it does not run OS-independently:
  # the binary must exist for the host. The classifiers name the platforms the
  # release actually builds (MoonBit toolchain: darwin-aarch64, linux-x86_64,
  # linux-aarch64, windows-x86_64), and `find_binary()` refuses anything else
  # with the carried-platform list before a call is made.
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wenhuang2333/LIWENJSON"
Repository = "https://github.com/wenhuang2333/LIWENJSON"
Issues = "https://github.com/wenhuang2333/LIWENJSON/issues"
Changelog = "https://github.com/wenhuang2333/LIWENJSON/blob/main/code/CHANGELOG.md"

[project.scripts]
liwenjson = "liwenjson.mcp:cli_main"
liwenjson-mcp = "liwenjson.mcp:main"
liwenjson-http = "liwenjson.http:main"

[tool.setuptools]
packages = ["liwenjson"]

# The package is typed, so the marker has to ship with it. Without it a type
# checker ignores the annotations and a consumer gets `Any` everywhere.
#
# `bin/*/liwenjson` is the engine, one directory per release platform: the
# wheel is self-contained, so `pip install liwenjson` is enough to make
# a call. `find_binary()` picks the directory this interpreter can run, and
# `build_wheel.sh` is what fills them in -- a plain `pip wheel` on a checkout
# builds the client without them and says so through `find_binary()`.
[tool.setuptools.package-data]
liwenjson = ["py.typed", "bin/*/liwenjson", "bin/*/liwenjson.exe"]

# Apache-2.0 section 4(d): a redistributor has to pass the NOTICE on. Keeping it
# at the distribution root makes it part of the sdist and the wheel's metadata.
[tool.setuptools.data-files]
"." = ["LICENSE", "NOTICE"]
