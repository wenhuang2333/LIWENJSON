# Release artifacts (O-13): a tag produces a GitHub Release with the native CLI
# for Linux, macOS and Windows, the wasm-gc probe, the browser demo bundle and
# their checksums.
#
# The CLI is built on the runner whose operating system it targets, because a
# MoonBit native build links against the host toolchain. Everything is packaged
# in one final job so that a single `SHA256SUMS` covers every asset.
#
# Two rules keep the release honest, and both are enforced by a step rather
# than by review: every file the packaging step puts in `dist/` is attached to
# the release, and the published asset set is compared against the published
# `SHA256SUMS` after the release exists.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release must not be able to ship a build that CI would reject.
  #
  # `publish` used to depend on `web` and `cli` only -- two jobs that build
  # artifacts and check that they run, not that they are correct. A tag could
  # therefore publish a binary whose test suite was red, and the checksum gate
  # would pass, because a checksum says nothing about correctness. Calling the
  # CI workflow here makes "release" mean "the same gates CI runs passed".
  test:
    name: CI gates before the release
    uses: ./.github/workflows/ci.yml

  web:
    name: wasm probe and browser bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION || '1.0.0-rc1+3c0520448' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build the probe and the demo bundle
        working-directory: code
        run: |
          moon build bench/probe --target wasm-gc --release
          moon build examples/web --target js --release

      - name: Rebuild the demo bundle and verify it is in sync
        run: |
          bash static/demo/build.sh
          git diff --exit-code -- static/demo/liwenjson.js

      # Stage the two files in one directory so the artifact has a flat,
      # predictable layout: upload-artifact keeps paths relative to the least
      # common ancestor, which would otherwise be the repository root.
      - name: Stage the web assets
        run: |
          mkdir -p "$RUNNER_TEMP/web-assets"
          cp code/_build/wasm-gc/release/build/bench/probe/probe.wasm "$RUNNER_TEMP/web-assets/probe.wasm"
          cp static/demo/liwenjson.js "$RUNNER_TEMP/web-assets/liwenjson-demo.js"
          # The installer is a release asset so that the one-command install in
          # the README is `curl .../releases/latest/download/liwenjson-install.sh
          # | sh`, which needs no clone and no toolchain.
          cp code/install.sh "$RUNNER_TEMP/web-assets/liwenjson-install.sh"
          chmod +x "$RUNNER_TEMP/web-assets/liwenjson-install.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: ${{ runner.temp }}/web-assets

  cli:
    name: CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: liwenjson-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: liwenjson-linux-arm64
          - os: macos-latest
            asset: liwenjson-macos-arm64
          - os: windows-latest
            asset: liwenjson-windows-x86_64.exe
        # There is no Intel macOS entry because there is no toolchain for it:
        # `cli.moonbitlang.com/install/unix.sh` resolves only
        # `Darwin arm64`, `Linux x86_64` and `Linux aarch64`, so a
        # `macos-15-intel` runner cannot install MoonBit at all. The job was
        # added on the assumption that the platform matrix was a choice; it is
        # not, it is whatever the toolchain publishes. A release that fails on
        # a platform it cannot build is worse than one that says so.
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION || '1.0.0-rc1+3c0520448' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # C-06: the Windows install used to be unpinned, so a new `latest` could
      # change the JavaScript backend's output overnight and turn a release on
      # a commit nobody touched red. `powershell.ps1` honours
      # $env:MOONBIT_INSTALL_VERSION (its first lines read it), so the same pin
      # as every other job works here.
      - name: Install the MoonBit toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION || '1.0.0-rc1+3c0520448' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Toolchain versions (the pin must have taken)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION || '1.0.0-rc1+3c0520448' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installed = (& moon version --all | Select-String -Pattern '^moonc v([^ ]+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value })
          if ($LASTEXITCODE -ne 0) { throw "moon version --all exited $LASTEXITCODE" }
          if ($installed -ne $env:MOONBIT_INSTALL_VERSION) {
            throw "moonc is $installed, expected $env:MOONBIT_INSTALL_VERSION (the pin did not take effect)"
          }

      - name: Build the CLI (Unix)
        if: runner.os != 'Windows'
        working-directory: code
        run: moon build cmd/liwenjson --target native --release

      - name: Build the CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          moon build cmd/liwenjson --target native --release

      - name: Check the CLI runs (Unix)
        if: runner.os != 'Windows'
        working-directory: code
        run: |
          printf '{"a":1,}' | ./_build/native/release/build/cmd/liwenjson/liwenjson.exe
          ./_build/native/release/build/cmd/liwenjson/liwenjson.exe --version

      # C-06: pwsh on GitHub's Windows runners does not fail a step when a
      # native command exits non-zero, so the old step could "verify" a CLI
      # that had crashed on its first document. Every command's exit code is
      # checked explicitly.
      - name: Check the CLI runs (Windows)
        if: runner.os == 'Windows'
        working-directory: code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cli = '.\_build\native\release\build\cmd\liwenjson\liwenjson.exe'
          $out = '{"a":1,}' | & $cli
          if ($LASTEXITCODE -ne 0) { throw "the CLI exited $LASTEXITCODE on a document it must repair" }
          try { $null = $out | ConvertFrom-Json -ErrorAction Stop }
          catch { throw "the CLI printed something that is not JSON: $out" }
          $version = & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "the CLI exited $LASTEXITCODE for --version" }
          '{"id":1,"method":"hello"}','{"id":2,"method":"shutdown"}' | & $cli serve | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the MCP server exited $LASTEXITCODE on hello/shutdown" }

      - name: Stage the CLI
        shell: bash
        run: cp code/_build/native/release/build/cmd/liwenjson/liwenjson.exe "$RUNNER_TEMP/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}

  publish:
    name: Publish the release
    needs: [web, cli, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/liwenjson-linux-x86_64/liwenjson-linux-x86_64 dist/liwenjson-linux-x86_64
          cp artifacts/liwenjson-linux-arm64/liwenjson-linux-arm64 dist/liwenjson-linux-arm64
          cp artifacts/liwenjson-macos-arm64/liwenjson-macos-arm64 dist/liwenjson-macos-arm64
          cp artifacts/liwenjson-windows-x86_64.exe/liwenjson-windows-x86_64.exe dist/liwenjson-windows-x86_64.exe
          cp artifacts/web-assets/probe.wasm dist/liwenjson-probe.wasm
          cp artifacts/web-assets/liwenjson-demo.js dist/liwenjson-demo.js
          cp artifacts/web-assets/liwenjson-install.sh dist/liwenjson-install.sh
          chmod +x dist/liwenjson-install.sh
          chmod +x dist/liwenjson-linux-x86_64 dist/liwenjson-linux-arm64 dist/liwenjson-macos-arm64
          (cd dist && sha256sum liwenjson-linux-x86_64 liwenjson-linux-arm64 liwenjson-macos-arm64 liwenjson-windows-x86_64.exe liwenjson-probe.wasm liwenjson-demo.js liwenjson-install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      # C-09 / §9.6: the asset set, the `want=` list above and the platform
      # table in `code/install.sh` are three statements of the same fact.
      # `release_manifest_check.sh` reads all three and exercises the installer
      # with fake platforms, so a platform whose asset is not in this release
      # (or an installer that would request one) fails here instead of 404ing
      # at a user's shell.
      - name: Check the release manifest against the packaged set
        run: |
          set -euo pipefail
          bash code/tests/release_manifest_check.sh --dist dist

      # The release body is the section of CHANGELOG.md for this tag, not the
      # whole file: a release note that opens with "this file records every
      # change" and then lists six older versions is a file, not a note.
      - name: Extract this version's changelog section
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; print; next }
            inside && /^## \[/     { exit }
            inside                 { print }
          ' code/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "no CHANGELOG section for $version" >&2
            exit 1
          fi
          wc -l "$RUNNER_TEMP/notes.md"

      # The upload list used to be written out by hand. When the Windows
      # target was added to `dist/`, the list was not updated with it, so
      # v1.1.0 shipped a SHA256SUMS that named a file the release did not
      # carry -- a checksum file that sends a reader to download something
      # that is not there. The list is now derived from `dist/`, and this step
      # asserts that `dist/` holds exactly the expected files (the seven release
      # assets plus SHA256SUMS) *before* anything is published: a release that
      # does not match its own checksums must never become public.
      - name: Check the release contents before publishing
        run: |
          set -euo pipefail
          want="SHA256SUMS liwenjson-demo.js liwenjson-install.sh liwenjson-linux-arm64 liwenjson-linux-x86_64 liwenjson-macos-arm64 liwenjson-probe.wasm liwenjson-windows-x86_64.exe"
          actual="$(cd dist && ls -1 | sort | tr '\n' ' ' | sed 's/ $//')"
          sorted="$(printf '%s\n' $want | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$sorted" ]; then
            echo "::error::dist/ holds '$actual' but the release must hold '$sorted'"
            exit 1
          fi
          echo "release contents: $actual"

      # `gh release create` is not idempotent, and a tag can be re-pointed at a
      # fixed commit, so replace any release that already exists for this tag.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
          # The upload list is `dist/*` -- derived from what was actually
          # packaged, not written out again by hand. The step above has
          # already asserted what `dist/` holds, so the glob cannot pick up a
          # stray file.
          gh release create "$GITHUB_REF_NAME" \
            --title "LIWENJSON $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*

      # A checksum file that names a file the release does not carry is worse
      # than no checksum file: it sends a reader to verify something they
      # cannot download, and it makes a broken release look signed. v1.1.0
      # shipped a SHA256SUMS that listed the Windows binary while the release
      # attached only five files, because the upload list was not updated when
      # the Windows matrix entry was added.
      #
      # This gate compares the published asset set against the published
      # SHA256SUMS, and proves that the published SHA256SUMS is the file that
      # was just uploaded. `--verify-hashes` is what makes it verify content:
      # without it the gate only checks that the names in SHA256SUMS are the
      # names on the release, so a release whose binaries were swapped (or
      # truncated on upload) still passes. `code/tests/release_assets.sh` is
      # the same script contributors run locally, so a release cannot pass here
      # and fail there.
      - name: Verify the published assets match SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f code/tests/release_assets.sh ]; then
            echo "::error::code/tests/release_assets.sh is missing from the checkout; the asset gate cannot run"
            exit 1
          fi
          bash code/tests/release_assets.sh "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --sums-file dist/SHA256SUMS \
            --verify-hashes
