# Publish the browser demo to GitHub Pages.
#
# static/demo/ is a static directory with no build step: live.html and
# index.html drive the MoonBit-compiled liwenjson.js in the browser. The whole
# directory is uploaded verbatim, so every relative reference (including
# ./liwenjson.js) resolves at the published URL:
#
#   https://wenhuang2333.github.io/LIWENJSON/          -> index.html
#   https://wenhuang2333.github.io/LIWENJSON/live.html -> the live demo
#
# Pages is enabled with build_type "workflow"; this file is the only source of
# deployments. See code/docs/REPRODUCE.md for the manual equivalent.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "static/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # deploy-pages lists this run's artifacts with this token
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static/demo to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the demo directory
        run: |
          mkdir -p _site
          cp -R static/demo/. _site/
          test -f _site/live.html
          test -f _site/index.html
          test -f _site/liwenjson.js
          ls -l _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # A failed deployment is otherwise opaque without the step log, which
      # anonymous readers cannot fetch. On failure, say which artifacts this
      # run's token can see and what the Pages site thinks of itself.
      - name: Explain a deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          echo "::error::deploy outcome=${{ steps.deployment.outcome }} url=${{ steps.deployment.outputs.page_url }}"
          curl -sS -m 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "$API/repos/$REPO/actions/runs/$RUN/artifacts?per_page=20" -o /tmp/artifacts.json -w 'artifacts_http=%{http_code}\n' || true
          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open("/tmp/artifacts.json"))
          except Exception as exc:
              print(f"::error::artifacts unreadable: {exc}")
          else:
              names = [a.get("name") for a in d.get("artifacts", [])]
              print(f"::error::artifacts visible={len(names)} names={names}")
          PY
          curl -sS -m 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "$API/repos/$REPO/pages" -o /tmp/pages.json -w 'pages_http=%{http_code}\n' || true
          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open("/tmp/pages.json"))
          except Exception as exc:
              print(f"::error::pages unreadable: {exc}")
          else:
              keep = {k: d.get(k) for k in ("status", "build_type", "cname", "html_url", "source")}
              print(f"::error::pages site={json.dumps(keep)[:800]}")
          PY
